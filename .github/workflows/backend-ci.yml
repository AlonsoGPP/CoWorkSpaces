name: Backend CI

on:
  pull_request:
    paths:
      - backend/**
      - .github/workflows/backend-ci.yml
  push:
    paths:
      - backend/**
      - .github/workflows/backend-ci.yml

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql+psycopg://admin:Admin123@dpg-d8k2fbv7f7vs73cgb59g-a:5432/cowork_reservations
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cowork_reservations
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: Admin123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin  -d cowork_reservations"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests

      - name: Black
        run: black --check src tests

      - name: isort
        run: isort --check-only src tests

      - name: Alembic migrations
        run: alembic upgrade head

      - name: Pytest
        run: pytest -q
